[project]
site_url = "https://mukappalambda.github.io/readings/"
site_name = "Readings"
# site_description = "Your project description"
site_author = "mukappalambda and vinsis"

copyright = "&copy; 2023 - 2026 mukappalambda and vinsis"

repo_url = "https://github.com/mukappalambda/readings"
repo_name = "readings"
edit_uri = "blob/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Linear Algebra" = [
    "memorize-sherman-morrison-formula.md",
    "why_krylov_subspace.md",
    "on-companion-matrices.md",
    "on-lagrange-multipliers-proof.md",
    "applications-of-lagrange-multipliers.md",
  ] },
  { "Probability" = [
    "stochastic-calculus/simple.md",
    "gumbel_softmax.md",
    "kurtosis.md",
  ] },
]

# Keep the KaTeX scripts and stylesheet on the same version.
extra_javascript = [
  "javascripts/katex.js",
  "https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js",
  "https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/contrib/auto-render.min.js",
]
extra_css = ["https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/mukappalambda/readings"
name = "Readings on GitHub"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
